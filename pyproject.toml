[project]
name = "sow-kickoff-studio"
version = "0.1.0"
description = "Generate branded kickoff presentations from Word statements of work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
  "pydantic>=2.8.0",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "streamlit>=1.39.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sow_kickoff"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

